[package]
name = "ccm"
version = "0.1.0"
edition = "2024"
description = "Composite Cognitive Model: orchestration of language models, agents, and workflows"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
ring = "0.17"
httpdate = "1"
sqlite-vfs = "0.2"
fs2 = "0.4"
libc = "0.2"
wasmi = "0.40"

[profile.release]
lto = true
